<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Panels — multi-panel GTA-style cover maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="masthead">
  <h1>Sunset Panels</h1>
  <p>Turn a photo and a caption into multi-panel sunset poster art. Your photos never leave this machine.</p>
</header>
<main class="workspace">
  <section class="preview-pane">
    <canvas id="preview" width="880" height="495" aria-label="Live cover preview"></canvas>
    <div class="preview-bar">
      <span>Preview</span>
      <div id="preview-size" class="pick-row"></div>
    </div>
    <div class="toolbar">
      <button id="undo-btn" type="button" disabled title="Undo the last edit (Ctrl+Z)">Undo</button>
      <button id="redo-btn" type="button" disabled title="Redo the undone edit (Ctrl+Shift+Z)">Redo</button>
      <button id="surprise-btn" type="button" title="Random layout, grade and caption">Surprise me</button>
      <button id="auto-btn" type="button" title="Pick the layout that fits your photo count">Auto layout</button>
      <button id="export-all-btn" type="button" class="export" title="Save all three post sizes at once">Export all three</button>
    </div>
    <p class="hint">Drag a panel in the preview to pan its photo. Pick a layout, then export a PNG.</p>
  </section>
  <aside class="controls">
    <section>
      <h2>Photos</h2>
      <div id="photo-slots" class="slots"></div>
      <div id="sample-buttons" class="row"></div>
      <label class="upload-label">Upload your own (up to 4)
        <input id="upload" type="file" accept="image/*" multiple>
      </label>
    </section>
    <section>
      <h2>Layout</h2>
      <div id="layout-pick" class="pick-row"></div>
    </section>
    <section>
      <h2>Look</h2>
      <div id="grade-pick" class="pick-row"></div>
      <div id="look-sliders"></div>
    </section>
    <section>
      <h2>Panels</h2>
      <div id="panel-controls"></div>
    </section>
    <section>
      <h2>Caption</h2>
      <label>Title <input id="title-input" type="text" maxlength="40" value="SUNSET BOULEVARD"></label>
      <label>Tagline <input id="tagline-input" type="text" maxlength="60" value="EVERY SUNSET HAS A PRICE"></label>
      <label>Script subtitle <input id="script-input" type="text" maxlength="40" value="chasing the golden hour"></label>
      <label>Title size <input id="title-size" type="range" min="0.7" max="1.3" step="0.05" value="1"></label>
      <div class="row"><span>Title stripes</span><div id="title-colors" class="swatches"></div></div>
      <label class="check"><input id="outline-toggle" type="checkbox" checked> Bold black outline</label>
    </section>
    <section>
      <h2>Export</h2>
      <div id="export-buttons" class="export-col"></div>
      <p id="status" role="status"></p>
    </section>
  </aside>
</main>
<script type="module" src="./src/editor.js"></script>
</body>
</html>
